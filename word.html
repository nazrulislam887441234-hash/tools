    <script>
        let isEnglish = true;

        function updateStats() {
            const text = document.getElementById('textInput').value.trim();
            const words = text ? text.split(/\s+/).filter(word => word.length > 0).length : 0;
            document.getElementById('wordCount').innerText = words.toLocaleString();
            document.getElementById('charCount').innerText = document.getElementById('textInput').value.length.toLocaleString();
            const lines = text ? document.getElementById('textInput').value.split(/\n/).length : 0;
            document.getElementById('lineCount').innerText = lines.toLocaleString();
            const paragraphs = text ? text.split(/\n\s*\n/).filter(p => p.trim().length > 0).length : 0;
            document.getElementById('paraCount').innerText = paragraphs.toLocaleString();
        }

        function clearText() {
            document.getElementById('textInput').value = '';
            updateStats();
        }

        function copyText() {
            const text = document.getElementById('textInput');
            text.select();
            document.execCommand('copy');
            alert(isEnglish ? 'Text copied to clipboard!' : 'টেক্সট কপি করা হয়েছে!');
        }

        function toggleLang() {
            isEnglish = !isEnglish;
            document.getElementById('toolTitle').innerText = isEnglish ? "Word Counter Pro" : "ওয়ার্ড কাউন্টার প্রো";
            document.getElementById('labelWords').innerText = isEnglish ? "Words" : "শব্দ";
            document.getElementById('labelChars').innerText = isEnglish ? "Characters" : "অক্ষর";
            document.getElementById('labelLines').innerText = isEnglish ? "Lines" : "লাইন";
            document.getElementById('labelParagraphs').innerText = isEnglish ? "Paragraphs" : "প্যারাগ্রাফ";
            document.getElementById('textInput').placeholder = isEnglish ? "Start typing or paste your content here..." : "এখানে আপনার টেক্সট লিখুন বা পেস্ট করুন...";
        }
    </script>
