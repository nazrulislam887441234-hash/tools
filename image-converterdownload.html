<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: #F0F4F8; color: #1e293b; }

       .main-card { background: white; border-radius: 2.5rem; box-shadow: 0 20px 50px rgba(0,40,85,0.1); border: 1px solid #e2e8f0; }
        #previewImg { max-width: 100%; max-height: 200px; border-radius: 1rem; object-fit: contain; display: block; margin: 0 auto; }

       .main-header { background: linear-gradient(135deg, #002855 0%, #004AAD 100%); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
       .brand-logo img { width: 40px; height: 40px; border-radius: 10px; }

        /* GHOTI Banner Ads */
      .ghoti-banner{ display:block; width:100%; max-width:981px; margin:20px auto; border-radius:16px; overflow:hidden; box-shadow:0 10px 25px rgba(0,40,85,.15); transition:.3s; }
      .ghoti-banner:hover{ transform:translateY(-4px); box-shadow:0 15px 35px rgba(255,140,0,.25); }
      .ghoti-banner img{ width:100%; height:auto; display:block; }

      .btn-download {
            background: linear-gradient(135deg, #002855 0%, #004AAD 100%);
            transition: all 0.3s ease;
       }
      .btn-download:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0, 40, 85, 0.3); background: #FF8C00; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header with Logo -->
    <nav class="main-header w-full p-4 flex justify-between items-center">
        <a href="https://ghotimarket.com" class="brand-logo flex items-center gap-3 text-white font-black text-xl px-4">
            <img src="https://tools.ghotimarket.com/logo.png" alt="GHOTI MARKET Logo">
            GHOTI MARKET <span class="text-[#00A8E8]">Tools</span>
        </a>
        <a href="image-converter.html" class="text-xs font-black bg-white/20 text-white px-4 py-2 rounded-full uppercase hover:bg-white/30 mr-4"><i class="fa-solid fa-arrow-left mr-1"></i> Convert New</a>
    </nav>

    <!-- GHOTI AD 1 - Top Banner -->
    <a class="ghoti-banner" href="https://ghotimarket.com" target="_blank">
        <img src="https://i.ibb.co/Y4jBRrSg/file-0002a081f5b7c5996f48098b30.png" alt="GHOTI MARKET - Best Digital Marketplace">
    </a>

    <main class="w-full max-w-4xl mx-auto px-4 py-4">

        <div class="main-card p-8 text-center max-w-2xl mx-auto">
            <div id="statusIcon" class="text-6xl mb-3">✅</div>
            <h1 class="text-3xl font-black text-[#002855] mb-2 uppercase tracking-tight">Processing Complete</h1>
            <p id="fileStatus" class="text-[#64748b] font-bold text-sm mb-6 uppercase tracking-widest">Your file is ready to save</p>

            <div class="mb-6 p-5 bg-[#F0F4F8] rounded-2xl border-2 border-dashed border-[#e2e8f0]">
                <img id="previewImg" class="hidden" alt="Converted Preview">
                <div id="pdfIcon" class="hidden text-6xl py-6 text-[#004AAD]"><i class="fa-solid fa-file-pdf"></i></div>
                <p id="displayFileName" class="mt-3 font-bold text-[#004AAD] truncate px-4"></p>
            </div>

            <!-- GHOTI AD 2 - In Card -->
            <a class="ghoti-banner" style="margin-bottom: 20px;" href="https://ghotimarket.com/tools" target="_blank">
                <img src="https://i.ibb.co/Y4jBRrSg/file-0000000002a081f5b7c5996f48098b30.png" alt="Use 20+ Free Tools">
            </a>

            <button id="finalDownload" class="btn-download w-full text-white font-black py-5 rounded-2xl text-lg shadow-xl uppercase tracking-wider mb-3">
                <i class="fa-solid fa-download mr-2"></i> Download File Now
            </button>
            <p class="text-[11px] text-[#64748b] font-bold uppercase tracking-widest mb-4">Secure local download • No server storage • 100% Private</p>
        </div>

        <!-- GHOTI AD 3 - Bottom Banner -->
        <a class="ghoti-banner" href="https://ghotimarket.com/shop" target="_blank">
            <img src="https://i.ibb.co/Y4jBRrSg/file-0002a081f5b7c5996f48098b30.png" alt="Shop Software and Gift Cards">
        </a>
    </main>

    <footer class="bg-[#002855] py-8 mt-auto text-center">
        <p class="text-[10px] font-black text-white/60 tracking-[3px] uppercase">© <span id="year"></span> GHOTI MARKET TOOLS • ALL RIGHTS RESERVED</p>
        <p class="text-[10px] text-white/40 mt-1">Made with ❤️ in Sylhet, Bangladesh</p>
    </footer>

    <script>
        document.getElementById('year').innerText = new Date().getFullYear();
        window.onload = function() {
            const fileData = localStorage.getItem('originalFile');
            const targetFormat = localStorage.getItem('targetFormat');
            const fileName = localStorage.getItem('fileName');
            const downloadBtn = document.getElementById('finalDownload');

            if (!fileData) {
                document.getElementById('fileStatus').innerText = "Session Expired. Please convert again.";
                document.getElementById('statusIcon').innerText = "❌";
                document.getElementById('statusIcon').className = "text-6xl mb-3 text-red-500";
                downloadBtn.disabled = true;
                downloadBtn.classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }

            // Display Info
            document.getElementById('displayFileName').innerText = `${fileName}.${targetFormat}`;

            // Show Preview if it's an image and not converting to PDF
            if (fileData.startsWith('data:image/') && targetFormat!== 'pdf') {
                const previewImg = document.getElementById('previewImg');
                previewImg.src = fileData;
                previewImg.classList.remove('hidden');
            } else {
                document.getElementById('pdfIcon').classList.remove('hidden');
            }

            // Download Trigger
            downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.href = fileData;
                link.download = `GHOTI_${fileName}.${targetFormat}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };
        };
    </script>
</body>
</html>
