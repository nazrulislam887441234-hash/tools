<script>
    function generatePass() {
        const len = document.getElementById('lengthInput').value;
        const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+~[]{};:,.<>?";
        let password = "";
        
        let finalLen = parseInt(len);
        if(isNaN(finalLen) || finalLen < 1) finalLen = 12;
        if(finalLen > 100) finalLen = 100;

        // Use crypto for better randomness
        let values = new Uint32Array(finalLen);
        window.crypto.getRandomValues(values);

        for (let i = 0; i < finalLen; i++) {
            password += charset.charAt(values[i] % charset.length);
        }

        const display = document.getElementById('password-display');
        display.innerText = password;
        display.style.borderColor = "#22c55e"; // Change to success color
        
        // Show the copy button
        document.getElementById('copyBtn').style.display = "inline-block";
    }

    function copyToClipboard() {
        const passText = document.getElementById('password-display').innerText;
        
        if (passText === "Click the button to start...") return;

        // Standard Copy Method for all devices
        const el = document.createElement('textarea');
        el.value = passText;
        document.body.appendChild(el);
        el.select();
        el.setSelectionRange(0, 99999); // For mobile
        document.execCommand('copy');
        document.body.removeChild(el);

        // Feedback
        const copyBtn = document.getElementById('copyBtn');
        const originalText = copyBtn.innerText;
        copyBtn.innerText = "Copied!";
        copyBtn.style.background = "#22c55e";
        
        setTimeout(() => {
            copyBtn.innerText = originalText;
            copyBtn.style.background = "#64748b";
        }, 2000);
    }
</script>
