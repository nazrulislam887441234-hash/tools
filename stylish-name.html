    <script>
        const normalChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        const fontMaps = {
            boldSerif: "𝐀𝐁𝐂𝐃𝐄𝐅𝐆𝐇𝐈𝐉𝐊𝐋𝐌𝐍𝐎𝐏𝐐𝐑𝐒𝐓𝐔𝐕𝐖𝐗𝐘𝐙𝐚𝐛𝐜𝐝𝐞𝐟𝐠𝐡𝐢𝐣𝐤𝐥𝐦𝐧𝐨𝐩𝐪𝐫𝐬𝐭𝐮𝐯𝐰𝐱𝐲𝐳𝟎𝟏𝟐𝟑𝟒𝟓𝟔𝟕𝟖𝟗",
            smallCaps: "ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀsᴛᴜᴠᴡxʏᴢ0123456789",
            script: "𝓐𝓑𝓒𝓓𝓔𝓕𝓖𝓗𝓘𝓙𝓚𝓛𝓜𝓝𝓞𝓟𝓠𝓡𝓢𝓣𝓤𝓥𝓦𝓧𝓨𝓩𝓪𝓫𝓬𝓭𝓮𝓯𝓰𝓱𝓲𝓳𝓴𝓛𝓶𝓷𝓸𝓹𝓺𝓻𝓼𝓽𝓾𝓿𝔀𝔁𝔂𝔃0123456789",
            gothic: "𝔄𝔅ℭ𝔇𝔈𝔉𝔊ℌℑ𝔍𝔎𝔏𝔐𝔑𝔒𝔓𝔔ℜ𝔖𝔗𝔘𝔙𝔚𝔛𝔜ℨ𝔞𝔟𝔠𝔡𝔢𝔣𝔤𝔥𝔦𝔧𝔨𝔩𝔪𝔫𝔬𝔭𝔮𝔯𝔰𝔱𝔲𝔳𝔴𝔵𝔶𝔷0123456789",
            italic: "𝘈𝘉𝘊𝘋𝘌𝘍𝘎𝘏𝘐𝘑𝘒𝘓𝘔𝘕𝘖𝘗𝘘𝘙𝘚𝘛𝘜𝘝𝘞𝘟𝘠𝘡𝘢𝘣𝘤𝘥𝘦𝘧𝘨𝘩𝘪𝘫ᴋ𝘭𝘮𝘯𝘰𝘱𝘲𝘳𝘴𝘵𝘶𝘷𝘸𝘹𝘺𝘻0123456789"
        };

        function convertText(text, font) {
            return text.split('').map(c => {
                const i = normalChars.indexOf(c);
                return i > -1 ? font[i] : c;
            }).join('');
        }

        const proDecor = [
            (n) => `╰➤ ${n}`, (n) => `×͜× ${n}`, (n) => `『V I P』${n}`, (n) => `亗 ${n} 亗`,
            (n) => `| ɪᴛᴢ | ${n}`, (n) => `⫷ ${n} ⫸`, (n) => `♛ ${n} ♛`, (n) => `々 ${n} 々`,
            (n) => `〆 ${n} 〆`, (n) => `༺ ${n} ༻`, (n) => `乡 ${n} 乡`, (n) => `๏ ${n} ๏`,
            (n) => `『G O D』${n}`, (n) => `⚡ ${n} ⚡`, (n) => `⚜️ ${n} ⚜️`, (n) => `🎗️ ${n} 🎗️`
        ];

        function generateNames() {
            const input = document.getElementById('nameInput').value.trim();
            const grid = document.getElementById('resultGrid');
            grid.innerHTML = '';
            if (!input) return;

            let finalResults = [];

            // Base Decors
            proDecor.forEach(decor => finalResults.push(decor(input)));

            // Font Variations
            if (/[a-zA-Z0-9]/.test(input)) {
                Object.values(fontMaps).forEach(font => {
                    const styled = convertText(input, font);
                    finalResults.push(styled);
                    finalResults.push(proDecor[Math.floor(Math.random() * proDecor.length)](styled));
                });
            }

            // Fill up to 100
            while (finalResults.length < 100) {
                const randomDecor = proDecor[Math.floor(Math.random() * proDecor.length)];
                finalResults.push(randomDecor(input));
            }

            finalResults.slice(0, 100).forEach(name => {
                const card = document.createElement('div');
                card.className = "result-card shadow-sm";
                card.innerHTML = `
                    <span class="name-text text-lg pr-2">${name}</span>
                    <button onclick="copyName('${name}', this)" class="copy-btn text-white text-[10px] font-black tracking-widest uppercase">COPY</button>
                `;
                grid.appendChild(card);
            });
        }

        function copyName(val, btn) {
            navigator.clipboard.writeText(val).then(() => {
                const original = btn.innerText;
                btn.innerText = "COPIED!";
                btn.style.background = "#10b981";
                setTimeout(() => { 
                    btn.innerText = original; 
                    btn.style.background = ""; 
                }, 1000);
            });
        }
    </script>
