       .header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
       .brand-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: white; font-weight: 900; font-size: 22px; }

       .container { width: 100%; max-width: 900px; margin: 40px auto; padding: 0 16px; }

       .hero-text { text-align: center; margin-bottom: 30px; }
       .hero-text h1 { font-size: 36px; font-weight: 900; color: #002855; text-transform: uppercase; }
       .hero-text p { color: #64748b; font-weight: 700; font-size: 13px; letter-spacing: 2px; }

      .converter-card {
            background: white;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(0,40,85,0.1);
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        #dropZone {
            border: 3px dashed #00A8E8; background: #f8fafc; padding: 45px 15px;
            border-radius: 18px; cursor: pointer; transition: 0.3s;
        }
        #dropZone:hover { border-color: #FF8C00; background: #fff7ed; transform: scale(1.01); }
        select {
            width: 100%; padding: 16px; border: 2px solid #cbd5e1; border-radius: 14px;

        }

            width: 100%; padding: 18px; background: linear-gradient(135deg, #002855 0%, #004AAD 100%);

            cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
            box-shadow: 0 10px 15px -3px rgba(0,40,85,0.2);

        #previewImg { max-height: 180px; margin: 15px auto; display: none; border-radius: 14px; border: 3px solid #e2e8f0; }

        /* GHOTI Banner Ads */
     .ghoti-banner{
            display:block; width:100%; max-width:981px; margin:25px auto; border-radius:16px;
            overflow:hidden; box-shadow:0 10px 25px rgba(0,40,85,.15); transition:.3s;
        }
     .ghoti-banner:hover{ transform:translateY(-4px); box-shadow:0 15px 35px rgba(255,140,0,.25); }
     .ghoti-banner img{ width:100%; height:auto; display:block; }

        /* Footer */

<body>

<!-- Header with Logo -->
<header class="main-header">
    <div class="header-container">
        <a href="https://ghotimarket.com" class="brand-logo">
            <img src="https://tools.ghotimarket.com/logo.png" alt="GHOTI MARKET Logo">
            GHOTI MARKET <span>Tools</span>
        </a>
    </div>
</header>

<!-- GHOTI AD 1 - Top Banner -->
<a class="ghoti-banner" href="https://ghotimarket.com" target="_blank">
    <img src="https://i.ibb.co/Y4jBRrSg/file-0002a081f5b7c5996f48098b30.png" alt="GHOTI MARKET - Best Digital Marketplace in Bangladesh">
</a>

<div class="container">
    <div class="hero-text">
        <h1>Image <span style="color:#FF8C00">Converter</span> Pro</h1>
        <p>SECURE • FAST • 100% FREE</p>
    </div>

    <div class="converter-card">
        <!-- GHOTI AD 2 - In Content -->
        <a class="ghoti-banner" style="margin-bottom:25px" href="https://ghotimarket.com/tools" target="_blank">
            <img src="https://i.ibb.co/Y4jBRrSg/file-0002a081f5b7c5996f48098b30.png" alt="Use 20+ Free Tools">
        </a>

        <div id="dropZone">
            <input type="file" id="fileInput" style="display: none;" accept="image/*">
            <div id="uploadUi">
                <i class="fa-solid fa-cloud-arrow-up" style="font-size: 50px; color: #00A8E8;"></i>
                <h2 style="margin-top: 15px; font-weight: 900; color: #002855; font-size: 22px;">SELECT YOUR IMAGE</h2>
                <p style="font-size: 13px; color: #64748b; font-weight: 600;">Click to upload or Drag & Drop JPG, PNG, WEBP</p>
            </div>
            <div id="fileInfo" style="display: none;">
                <img id="previewImg">
                <p id="fileName" style="font-weight: 800; color: #004AAD; margin-top: 10px;"></p>
            </div>
        </div>

        <div id="formatSection" style="display: none;">
            <label style="font-weight:800;color:#002855;font-size:12px;letter-spacing:1px">SELECT OUTPUT FORMAT:</label>
            <select id="outputFormat">
                <option value="jpeg">Convert to JPG - Best for Photos</option>
                <option value="png">Convert to PNG - Best for Quality</option>
                <option value="webp">Convert to WEBP - Best for Web</option>
                <option value="pdf">Convert to PDF - For Documents</option>
            </select>
            <button id="convertBtn"><i class="fa-solid fa-wand-magic-sparkles"></i> Convert & Download Now</button>
        </div>
    </div>

    <!-- GHOTI AD 3 - Bottom Banner -->
    <a class="ghoti-banner" href="https://ghotimarket.com/shop" target="_blank">
        <img src="https://i.ibb.co/Y4jBRrSg/file-0002a081f5b7c5996f48098b30.png" alt="Shop Software, Gift Cards">
    </a>
</div>

<footer>
    <div style="max-width: 1200px; margin: 0 auto;">
        <p style="margin-bottom: 8px;">Powered by <a href="https://ghotimarket.com" target="_blank">GHOTI MARKET</a></p>
        <p style="color: #94a3b8; font-size: 10px; letter-spacing: 2px;">© <span id="year"></span> GHOTI MARKET TOOLS • ALL RIGHTS RESERVED</p>
    </div>
</footer>

<script>
    document.getElementById('year').innerText = new Date().getFullYear();
    const { jsPDF } = window.jspdf;
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    let uploadedFile = null;
    let imageDataUrl = "";

    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => handleFile(e.target.files[0]);
    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.style.borderColor = '#FF8C00'; };
    dropZone.ondragleave = () => dropZone.style.borderColor = '#00A8E8';
    dropZone.ondrop = (e) => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); };

    function handleFile(file) {
        if (!file ||!file.type.startsWith('image/')) return alert("Please select a valid image file");
        uploadedFile = file;
        document.getElementById('uploadUi').style.display = 'none';
        document.getElementById('fileInfo').style.display = 'block';
        document.getElementById('formatSection').style.display = 'block';
        document.getElementById('fileName').innerText = "File: " + file.name;

        const reader = new FileReader();
        reader.onload = (ev) => {
            imageDataUrl = ev.target.result;
            document.getElementById('previewImg').src = imageDataUrl;
            document.getElementById('previewImg').style.display = 'block';
        };
        reader.readAsDataURL(file);
    }

    document.getElementById('convertBtn').onclick = () => {
        if (!uploadedFile) return alert("Please select a file first!");

        const targetFormat = document.getElementById('outputFormat').value;
        const cleanName = uploadedFile.name.split('.')[0];
        const img = new Image();

        img.onload = function() {
            const canvas = document.createElement('canvas');
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext('2d');

            if(targetFormat === 'jpeg') {
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            ctx.drawImage(img, 0, 0);

            if(targetFormat === 'pdf') {
                const pdf = new jsPDF({
                    orientation: img.width > img.height? 'l' : 'p',
                    unit: 'px',
                    format: [img.width, img.height]
                });
                pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, img.width, img.height);
                pdf.save(cleanName + '.pdf');
                return;
            }

            let mimeType = 'image/' + targetFormat;
            let quality = targetFormat === 'jpeg'? 0.92 : 1.0;
            const dataUrl = canvas.toDataURL(mimeType, quality);
            downloadFile(dataUrl, cleanName + '.' + targetFormat);
        };
        img.src = imageDataUrl;
    };

    function downloadFile(dataUrl, filename) {
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
