<script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const fileInfo = document.getElementById('fileInfo');
    const uploadUi = document.getElementById('uploadUi');
    const previewImg = document.getElementById('previewImg');
    const pdfIcon = document.getElementById('pdfIcon');
    const formatSection = document.getElementById('formatSection');
    const outputFormat = document.getElementById('outputFormat');

    let uploadedFileSrc = "";
    let isPdfFile = false;

    dropZone.onclick = () => fileInput.click();

    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        uploadUi.style.display = 'none';
        fileInfo.style.display = 'block';
        formatSection.style.display = 'block';
        document.getElementById('fileName').innerText = file.name;

        if (file.type.startsWith('image/')) {
            isPdfFile = false;
            const reader = new FileReader();
            reader.onload = (ev) => {
                previewImg.src = ev.target.result;
                uploadedFileSrc = ev.target.result; // সেভ ইমেজ সোর্স
                previewImg.style.display = 'block';
                pdfIcon.style.display = 'none';
            };
            reader.readAsDataURL(file);
        } else if (file.type === 'application/pdf') {
            isPdfFile = true;
            previewImg.style.display = 'none';
            pdfIcon.style.display = 'block';
            const reader = new FileReader();
            reader.onload = (ev) => {
                uploadedFileSrc = ev.target.result;
            };
            reader.readAsDataURL(file);
        }
    };

    document.getElementById('convertBtn').onclick = () => {
        const file = fileInput.files[0];
        if (!file) return;

        const targetFormat = outputFormat.value;
        const cleanName = file.name.split('.')[0];

        // ফিক্স লজিক: ইমেজ থেকে PDF বানানোর সফল ক্লায়েন্ট-সাইড মেথড
        if (!isPdfFile && targetFormat === 'pdf') {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                
                // ইমেজ ডেটাকে সরাসরি ভ্যালিড PDF ডাটা-ইউআরএল এ কনভার্ট করার স্ট্রাকচার
                const imgData = canvas.toDataURL('image/jpeg', 1.0);
                localStorage.setItem('originalFile', imgData);
                localStorage.setItem('targetFormat', 'pdf');
                localStorage.setItem('fileName', cleanName);
                window.location.href = 'image-converterdownload.html';
            };
            img.src = uploadedFileSrc;
        } else {
            // সাধারণ অন্য ফরম্যাটের প্রসেসিং স্ট্রাকচার
            localStorage.setItem('originalFile', uploadedFileSrc);
            localStorage.setItem('targetFormat', targetFormat);
            localStorage.setItem('fileName', cleanName);
            window.location.href = 'image-converterdownload.html';
        }
    };
</script>
