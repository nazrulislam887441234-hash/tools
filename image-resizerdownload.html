<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght=400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f8fafc; }
        /* অ্যাড লোড হওয়ার সময় বা পরে লেআউট যেন ভেঙে না যায় তার ফিক্স */
        .ad-wrapper { display: flex; justify-content: center; align-items: center; width: 100%; margin: 15px 0; clear: both; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="ad-wrapper min-h-[250px]">
        <script type="text/javascript">
            atOptions = {
                'key' : '477db1ddaffe6205fad66ddcfeaec244',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://www.highperformanceformat.com/477db1ddaffe6205fad66ddcfeaec244/invoke.js"></script>
    </div>

    <div class="max-w-xl w-full bg-white p-8 md:p-12 rounded-[3rem] shadow-2xl text-center">
        <h1 class="text-3xl font-black text-slate-900 mb-6">Optimization Complete!</h1>
        
        <div class="mb-8 p-4 bg-blue-50 rounded-3xl inline-block">
            <img id="resultPreview" class="max-h-64 rounded-2xl mx-auto shadow-md border-4 border-white" src="" alt="Preview">
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-slate-50 p-4 rounded-2xl">
                <p class="text-xs font-bold text-slate-400 uppercase">Old Size</p>
                <p id="oldSizeDisplay" class="font-bold text-red-500">-</p>
            </div>
            <div class="bg-green-50 p-4 rounded-2xl">
                <p class="text-xs font-bold text-green-400 uppercase">Optimized</p>
                <p id="newSizeDisplay" class="font-bold text-green-600">-</p>
            </div>
        </div>

        <a id="downloadLink" download="optimized-image.jpg" class="block w-full bg-blue-600 text-white font-black text-xl py-5 rounded-2xl shadow-xl hover:bg-blue-700 transition-all mb-4 cursor-pointer">
            Download Image
        </a>
        
        <div class="ad-wrapper my-6">
            <script async="async" data-cfasync="false" src="https://pl29236068.effectivecpmnetwork.com/14e25f0c3055f1c538d471f457a3c6ed/invoke.js"></script>
            <div id="container-14e25f0c3055f1c538d471f457a3c6ed" class="w-full"></div>
        </div>
        
        <a href="image-resizer.html" class="text-slate-400 font-bold hover:text-blue-600 transition-colors italic block mt-4">Resize Another Image</a>
    </div>

    <script>
        window.onload = () => {
            const imgData = localStorage.getItem('compressedImg');
            const oldSize = localStorage.getItem('oldSize');
            const newSize = localStorage.getItem('newSize');
            const imgName = localStorage.getItem('imgName');

            if(!imgData) {
                location.assign("image-resizer.html");
                return;
            }

            document.getElementById('resultPreview').src = imgData;
            document.getElementById('oldSizeDisplay').innerText = oldSize + " KB";
            document.getElementById('newSizeDisplay').innerText = newSize + " KB";
            document.getElementById('downloadLink').href = imgData;
            document.getElementById('downloadLink').download = "optimized-" + imgName;
        }
    </script>

    <script type='text/javascript' src='https://pl29236066.effectivecpmnetwork.com/5e/32/85/5e3285c94bc70b4338010c30b7054a1b.js'></script>

</body>
</html>
