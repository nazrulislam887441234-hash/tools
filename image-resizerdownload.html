        /* GHOTI Banner Ads */
      .ghoti-banner{ display:block; width:100%; max-width:981px; margin:20px auto; border-radius:16px; overflow:hidden; box-shadow:0 10px 25px rgba(0,40,85,.15); transition:.3s; }
      .ghoti-banner:hover{ transform:translateY(-4px); box-shadow:0 15px 35px rgba(255,140,0,.25); }
      .ghoti-banner img{ width:100%; height:auto; display:block; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Header -->
    <header class="main-header w-full py-4 px-6 fixed top-0">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="https://ghotimarket.com" class="brand-logo flex items-center gap-3 text-white font-black text-xl">
                <img src="https://tools.ghotimarket.com/logo.png" alt="GHOTI MARKET Logo">
                GHOTI MARKET <span class="text-[#00A8E8]">Tools</span>
            </a>
        </div>
    </header>

    <!-- GHOTI AD 1 - Top Banner -->
    <a class="ghoti-banner mt-24" href="https://ghotimarket.com" target="_blank">
        <img src="https://i.ibb.co/Y4jBRrSg/file-0002a081f5b7c5996f48098b30.png" alt="GHOTI MARKET - Best Digital Products">
    </a>

    <div class="max-w-xl w-full bg-white p-8 md:p-10 rounded-[3rem] shadow-2xl text-center border border-slate-200 mt-6">
        <div class="text-6xl mb-3">🎉</div>
        <h1 class="text-3xl font-black text-[#002855] mb-6">Optimization Complete!</h1>

        <div class="mb-8 p-4 bg-[#F0F4F8] rounded-3xl inline-block">
            <img id="resultPreview" class="max-h-64 rounded-2xl mx-auto shadow-md border-4 border-white" src="" alt="Preview">
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-red-50 p-4 rounded-2xl border-red-100">
                <p class="text-xs font-black text-red-500 uppercase tracking-widest">Old Size</p>
                <p id="oldSizeDisplay" class="font-black text-red-600 text-xl">-</p>
            </div>
            <div class="bg-green-50 p-4 rounded-2xl border border-green-100">
                <p class="text-xs font-black text-green-600 uppercase tracking-widest">Optimized</p>
                <p id="newSizeDisplay" class="font-black text-green-700 text-xl">-</p>
            </div>
        </div>

        <a id="downloadLink" download="optimized-image.jpg" class="btn-download block w-full text-white font-black text-xl py-5 rounded-2xl shadow-xl mb-4 cursor-pointer">
            <i class="fa-solid fa-download mr-2"></i> Download Optimized Image
        </a>

        <!-- GHOTI AD 2 - Middle Banner -->
        <a class="ghoti-banner my-6" href="https://ghotimarket.com/tools" target="_blank">
            <img src="https://i.ibb.co/Y4jBRrSg/file-0002a081f5b7c5996f48098b30.png" alt="Use 20+ Free Tools">
        </a>

        <a href="image-resizer.html" class="text-[#64748b] font-bold hover:text-[#FF8C00] transition-colors italic block mt-4"><i class="fa-solid fa-arrow-left mr-1"></i> Resize Another Image</a>
    </div>

    <!-- GHOTI AD 3 - Bottom Banner -->
    <a class="ghoti-banner" href="https://ghotimarket.com/shop" target="_blank">
        <img src="https://i.ibb.co/Y4jBRrSg/file-0002a081f5b7c5996f48098b30.png" alt="Shop Software and Gift Cards">
    </a>

    <footer class="py-8 text-center">
        <p class="text-[10px] font-black text-[#002855]/60 tracking-[3px] uppercase">© <span id="year"></span> GHOTI MARKET TOOLS</p>
    </footer>

    <script>
        document.getElementById('year').innerText = new Date().getFullYear();
        window.onload = () => {
            const imgData = localStorage.getItem('compressedImg');
            const oldSize = localStorage.getItem('oldSize');
            const newSize = localStorage.getItem('newSize');
            const imgName = localStorage.getItem('imgName');

            if(!imgData) {
                location.assign("image-resizer.html");
                return;
            }

            document.getElementById('resultPreview').src = imgData;
            document.getElementById('oldSizeDisplay').innerText = oldSize + " KB";
            document.getElementById('newSizeDisplay').innerText = newSize + " KB";
            document.getElementById('downloadLink').href = imgData;
            document.getElementById('downloadLink').download = "GHOTI_optimized-" + imgName;
        }
    </script>

</body>
</html>
